<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Интерактивный пример Qumir</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/embed.css">
</head>
<body class="qumir-embedded" data-qumir-mode="embed">
  <main>
    <section class="pane left">
      <div class="pane-title"><span>Редактор</span></div>
      <textarea id="code" aria-label="Программа" spellcheck="false"></textarea>
      <div class="pane-footer">
        <div class="pane-footer-run">
          <button id="btn-run" type="button" disabled>▶ Запустить</button>
          <button id="btn-stop" type="button" style="display:none">■ Стоп</button>
          <button id="example-reset" type="button" disabled>Сбросить</button>
          <button id="example-open" type="button" disabled>Открыть в песочнице</button>
        </div>
        <div id="status" class="status" role="status"></div>
      </div>
    </section>
    <section class="pane preview">
      <div class="pane-title"><span>Просмотр</span></div>
      <div id="preview-body" class="preview-body"></div>
    </section>
  </main>
  <pre id="example-result" role="status" hidden></pre>
  <section id="example-io" class="io">
    <div class="pane-title"><span>Ввод/Вывод</span></div>
    <div class="io-toolbar">
      <div id="io-tabs" class="io-tabs" role="tablist" aria-label="Ввод/Вывод"></div>
      <select id="io-select" hidden aria-hidden="true" tabindex="-1">
        <option value="stdout">Вывод</option><option value="stdin">Ввод</option>
      </select>
      <button id="io-add-file" type="button" class="io-icon" aria-label="Добавить файл">＋</button>
    </div>
    <div class="io-pane-container">
      <div class="io-pane io-pane-stdout" data-io-pane="stdout"><pre id="stdout" class="scroll"></pre></div>
      <div class="io-pane io-pane-stdin" data-io-pane="stdin"><textarea id="stdin" aria-label="Входные данные" spellcheck="false"></textarea></div>
      <div id="io-files" class="io-files"></div>
    </div>
  </section>
  <input id="args" type="hidden" value="">
  <input id="opt" type="hidden" value="0">
  <input id="view" type="hidden" value="ir">
  <pre id="output" hidden></pre>
  <script type="module" src="/embed.js"></script>
</body>
</html>
